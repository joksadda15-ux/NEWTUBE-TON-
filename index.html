<style>
:root{--bg:#06060b;--card:#13131c;--card2:#1b1b27;--line:rgba(255,255,255,.08);--ink:#f5f5f9;--mute:#9b9bb0;--acc:#ff3d71;--acc2:#ff9d3d;--vio:#7c5cff;--r:16px;--grad:linear-gradient(135deg,#ff3d71,#ff9d3d)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Helvetica,Arial,sans-serif;font-size:14px}
body{background:radial-gradient(520px 320px at 100% -40px,rgba(124,92,255,.26),transparent 70%),radial-gradient(480px 300px at -10% 0,rgba(255,61,113,.2),transparent 70%),var(--bg);background-attachment:fixed}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(6,6,11,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;letter-spacing:.6px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 4px 18px rgba(255,61,113,.45)}

.nav svg{width:21px;height:21px}
/* hero carousel */
.hw{position:relative;margin-top:12px}
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:22px}
.hs::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10.5;background:linear-gradient(135deg,#2b1747,#10202f);cursor:pointer;overflow:hidden}

.hg{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,11,.97) 6%,rgba(6,6,11,.15) 62%)}

.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px;margin-bottom:8px}
.ht{font-size:19px;font-weight:800;line-height:1.25;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.35);transition:.25s}.dots i.on{width:18px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:13.5px}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 20px rgba(255,61,113,.38)}

.row{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}
.row::-webkit-scrollbar{display:none}
.row .yt{flex:0 0 226px}.row .po{flex:0 0 116px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 9px}
.yt,.po{cursor:pointer;animation:up .35s both;transition:transform .15s}.yt:active,.po:active{transform:scale(.97)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#2b1747,#10202f);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.th img,.pth img{width:100%;height:100%;object-fit:cover}
.pl{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:10px}
.pbadge{position:absolute;left:8px;top:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:999px;background:var(--vio)}
.tt,.pt{margin-top:7px;font-size:12.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pth{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#2b1747,#10202f);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.badge{position:absolute;left:6px;top:6px;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.bar{position:sticky;top:59px;z-index:10;background:linear-gradient(var(--bg) 82%,rgba(6,6,11,0));padding:10px 0 6px}
.search{width:100%;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;outline:0}
.search:focus{border-color:rgba(255,61,113,.6)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -14px 0;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--mute);transition:.15s}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(255,61,113,.35)}
.more{display:block;margin:20px auto 0}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.7}
.msg .btn{margin-top:14px}
/* overlays */
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;padding-bottom:env(safe-area-inset-bottom)}
#ov.on{display:block}
.x{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.dh{position:relative;aspect-ratio:16/11;background:linear-gradient(135deg,#2b1747,#10202f)}
.dh img{width:100%;height:100%;object-fit:cover}
.dh .x{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top))}
.dbody{padding:0 16px 30px;margin-top:-38px;position:relative}
.dcat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;background:rgba(255,255,255,.14);padding:4px 11px;border-radius:999px}
.dbody h1{font-size:22px;line-height:1.25;margin:9px 0 16px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.note{margin-top:16px;color:var(--mute);font-size:12px;line-height:1.6}
.ph{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;aspect-ratio:16/9;background:#000}
.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.cd{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.84);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px}
.cd.on{display:flex}
.cdn{font-size:46px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cdt{font-size:13px;color:#ddd}
.pinfo{padding:14px 16px 0}
.pinfo h1{font-size:17px;line-height:1.3}
.pbody{padding:0 14px 30px}
.nx{display:flex;gap:11px;align-items:center;margin-bottom:12px;cursor:pointer}
.nx .th{width:128px;flex:0 0 auto}.nx .pth{width:70px;flex:0 0 auto}
.nx .tt{margin:0;font-size:13px}
/* ads + profile */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:11px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.card .ic{width:46px;height:46px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:23px;flex:0 0 auto}
.card .mid{flex:1;min-width:0}.card .mid b{display:block;font-size:14px}.card .mid span{font-size:12px;color:var(--mute)}
.lead{color:var(--mute);line-height:1.6;font-size:13px;margin:6px 0 14px}
.pav{width:96px;height:96px;border-radius:50%;margin:10px auto 12px;background:var(--grad);display:grid;place-items:center;font-size:40px;font-weight:800;overflow:hidden;border:3px solid var(--card2);box-shadow:0 8px 28px rgba(255,61,113,.35)}
.pav img{width:100%;height:100%;object-fit:cover}
.pname{text-align:center;font-size:19px;font-weight:800}.psub{text-align:center;color:var(--mute);margin-top:3px;font-size:13px}
.stats{display:flex;gap:10px;margin:18px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stats b{display:block;font-size:21px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.stats span{font-size:11.5px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;background:#262633;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>

<body>
<div class="top">
  <div class="brand"><div class="mark">N</div><span>NEW<b>TUBE</b></span></div>
  <button class="pbtn" id="pbtn" data-act="prof" aria-label="Profile"></button>
</div>
<div id="view"></div>
<div class="nav" id="nav"></div>
<div id="ov"></div>
<div id="toast"></div>

<script>
'use strict';
// ═════════ CONFIG ═════════
const API = 'https://newtube-ton.vercel.app/api';
const BOT = 'NewTube12_bot';
const ADSGRAM_INT = 'int-27565';     // interstitial: before a video + every 6 min of watching
const ADSGRAM_BLOCK = '27566';       // block ad: Download button + Ads section
const ADSGRAM_TASK = 'task-53569';   // sponsored task card in the Ads section
const AD_EVERY_SEC = 360;            // one ad break per 6 minutes of watching (5-second warning first)
const PREROLL_GAP_MS = 60000;        // no second pre-roll within 60s (stops back-to-back ads when browsing)
const PAGE = 12;
// category → emoji (same list as the bot's admin buttons; any new category the admin types shows with 📁)
const CAT_ICON = { 'Islamic': '🕌', 'Drama': '🎭', 'Movie': '🎬', 'Anime': '🍥', 'Manga/Manhwa': '📚', 'Documentary': '🎞️', 'Series': '📺', 'Cartoon/Kids': '🧸', 'Bangla': '🇧🇩', 'Hindi': '🇮🇳', 'Hollywood': '🎥', 'K-Drama': '🇰🇷', 'Comedy': '😂', 'Action': '💥', 'Horror': '👻', 'Romance': '💕', 'Sci-Fi': '🚀', 'Thriller': '🕵️', 'Music': '🎵', 'Education': '🎓', 'Motivation': '💪', 'Technology': '💻', 'Gaming': '🎮', 'Sports': '⚽', 'Cooking': '🍳', 'Travel': '✈️', 'Nature': '🌿', 'News': '📰', 'Health': '🩺', 'History': '🏛️', 'Science': '🔬', 'Podcast': '🎙️', 'Other': '📁' };
const CAT_ORDER = Object.keys(CAT_ICON);
const icon = c => CAT_ICON[c] || '📁';

const tg = window.Telegram && window.Telegram.WebApp;
[() => tg.ready(), () => tg.expand(), () => tg.setHeaderColor('#06060b'), () => tg.setBackgroundColor('#06060b')].forEach(f => { try { f(); } catch (e) {} });
const U = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// yt = YouTube section, mv = Videos section (movies/anime… from the Telegram channel)
const LIB = { yt: { list: [], cat: 'All', q: '', shown: PAGE }, mv: { list: [], cat: 'All', q: '', shown: 18 } };
const state = { tab: 'yt', ptoken: 0, adBusy: false, lastAdAt: 0, cur: null, sig: {}, adAt: {}, heroT: 0 };

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
function imgSrc(u) { u = String(u || ''); if (u.startsWith('data?')) return API + '/' + u; return /^https:\/\//i.test(u) ? u : ''; }
const ytThumb = v => imgSrc(v.thumbnail) || (v.videoId ? `https://img.youtube.com/vi/${encodeURIComponent(v.videoId)}/hqdefault.jpg` : '');
const itemImg = (k, v) => k === 'yt' ? ytThumb(v) : imgSrc(v.thumbnail);
const isPlaylist = v => !!v.listId && !v.videoId;

// ═════════ DATA (cached on the phone, so the app still opens when the server is slow or down) ═════════
async function getData(type, render) {
  const key = 'nt_c_' + type, cached = store.get(key, null);
  if (cached) render(cached);
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(`${API}/data?type=${type}`, { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (!j.ok || !Array.isArray(j[type])) throw new Error('bad');
    store.set(key, j[type]);
    render(j[type]);
  } catch (e) { if (!cached) render(null); }
}
async function postData(body) {
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(`${API}/data`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    clearTimeout(t);
    return await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
}

// ═════════ ADS ═════════
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function showInterstitial() {
  try { if (!window.Adsgram) return false; await withTimeout(window.Adsgram.init({ blockId: ADSGRAM_INT }).show(), 120000); return true; } catch (e) { return false; }
}
// block ad → 'ok' | 'noads' (no inventory / SDK blocked) | 'closed' (user closed it early)
async function showBlockAd() {
  if (!window.Adsgram) return 'noads';
  try { const r = await withTimeout(window.Adsgram.init({ blockId: ADSGRAM_BLOCK }).show(), 120000); return r && r.done === false ? 'closed' : 'ok'; }
  catch (e) { return e && e.done === false && e.error === false ? 'closed' : 'noads'; }
}
const showGiga = async () => { if (typeof window.showGiga !== 'function') throw 0; await withTimeout(window.showGiga('main'), 120000); };
const showMonetag = async () => { if (typeof window.show_9442539 !== 'function') throw 0; await withTimeout(window.show_9442539(), 90000); };
const NETS = [
  { id: 'adsgram', name: 'Adsgram', icon: '📺', run: async () => { const r = await showBlockAd(); if (r !== 'ok') throw 0; } },
  { id: 'giga', name: 'GigaPub', icon: '🎯', run: showGiga },
  { id: 'monetag', name: 'Monetag', icon: '⚡', run: showMonetag }
];
async function watchAd(id) {
  const n = NETS.find(x => x.id === id); if (!n || state.adBusy) return;
  const wait = 30000 - (Date.now() - (state.adAt[id] || 0));
  if (wait > 0) return toast(`Please wait ${Math.ceil(wait / 1000)}s before the next ad`);
  state.adBusy = true; toast(`Loading ${n.name} ad…`);
  try { await n.run(); state.adAt[id] = Date.now(); toast('Thanks for supporting NEWTUBE ❤️'); }
  catch (e) { toast(`${n.name} ad isn’t available right now. Try another one.`); }
  finally { setTimeout(() => { state.adBusy = false; }, 1200); }
}

// ═════════ TABS ═════════
const ICONS = {
  yt: '<path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>',
  mv: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 6l-2-3M12 6l-2-3M17 6l-2-3"/>',
  ads: '<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>'
};
const TABS = [['yt', 'YouTube'], ['mv', 'Videos'], ['ads', 'Ads']];
function drawNav() {
  $('#nav').innerHTML = TABS.map(([id, l]) => `<button data-act="tab" data-id="${id}" class="${state.tab === id ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${l}</button>`).join('');
}
function switchTab(id) {
  state.tab = id; clearInterval(state.heroT); drawNav(); window.scrollTo(0, 0); state.sig = {};
  if (id === 'ads') tabAds(); else tabLib(id);
}
const skeleton = () => `<div class="sk" style="aspect-ratio:16/10.5;margin-top:12px;border-radius:22px"></div><div class="grid2" style="margin-top:22px">${'<div class="sk" style="aspect-ratio:16/9"></div>'.repeat(4)}</div>`;
const errBlock = t => `<div class="msg">😕<br>${t}<br><button class="btn pri" data-act="retry">Try again</button></div>`;
const changed = (k, d) => { const s = JSON.stringify(d); if (state.sig[k] === s) return false; state.sig[k] = s; return true; };

// ───── cards ─────
const ytCard = v => `<div class="yt" data-act="play" data-id="${esc(v._id)}"><div class="th"><img loading="lazy" src="${ytThumb(v)}" alt="" onerror="this.remove()">${isPlaylist(v) ? '<span class="pbadge">PLAYLIST</span>' : ''}<span class="pl">▶</span></div><div class="tt">${esc(v.title)}</div></div>`;
const poCard = m => `<div class="po" data-act="open" data-id="${esc(m._id)}"><div class="pth"><img loading="lazy" src="${imgSrc(m.thumbnail)}" alt="" onerror="this.remove()"><span class="badge">${icon(m.category)} ${esc(m.category || '')}</span></div><div class="pt">${esc(m.title)}</div></div>`;
const card = (k, v) => k === 'yt' ? ytCard(v) : poCard(v);

// ───── hero carousel (auto-slides every 5 s) ─────
function heroHtml(k, items) {
  return `<div class="hw"><div class="hs" id="hs">${items.map(it => `<div class="slide" data-act="${k === 'yt' ? 'play' : 'open'}" data-id="${esc(it._id)}"><img src="${itemImg(k, it)}" alt="" onerror="this.remove()"><div class="hg"></div><div class="hc"><div class="tag">${icon(it.category)} ${esc((it.category || 'New').toUpperCase())}</div><div class="ht">${esc(it.title)}</div><span class="btn pri">${k === 'yt' ? '▶ Play' : '▶ Watch now'}</span></div></div>`).join('')}</div><div class="dots" id="dots">${items.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div></div>`;
}
function startHero() {
  clearInterval(state.heroT);
  const hs = $('#hs'), dots = $('#dots'); if (!hs || !dots) return;
  const n = hs.children.length, ds = [...dots.children];
  hs.onscroll = () => { const i = Math.round(hs.scrollLeft / hs.clientWidth); ds.forEach((d, j) => d.classList.toggle('on', j === i)); };
  if (n > 1) state.heroT = setInterval(() => {
    if (document.body.classList.contains('lock') || document.hidden) return;
    const i = (Math.round(hs.scrollLeft / hs.clientWidth) + 1) % n; hs.scrollTo({ left: i * hs.clientWidth, behavior: 'smooth' });
  }, 5000);
}

// ───── YouTube + Videos sections share one movie-site layout: search · category chips · hero · category rows ─────
function tabLib(k) {
  const L = LIB[k];
  $('#view').innerHTML = `<div class="bar"><input class="search" id="q" type="search" placeholder="${k === 'yt' ? 'Search YouTube videos…' : 'Search movies, anime…'}" value="${esc(L.q)}"><div class="chips" id="chips"></div></div><div id="body">${skeleton()}</div>`;
  $('#q').addEventListener('input', e => { L.q = e.target.value.trim(); L.shown = k === 'yt' ? PAGE : 18; paintLib(k); });
  getData(k === 'yt' ? 'videos' : 'movies', list => {
    if (state.tab !== k) return;
    if (list && !changed(k, list)) return;
    L.list = list; paintLib(k);
  });
}
function paintLib(k) {
  const L = LIB[k], body = $('#body'), chips = $('#chips'); if (!body) return;
  const list = L.list;
  if (!list) { chips.innerHTML = ''; body.innerHTML = errBlock('Couldn’t load. Check your internet.'); return; }
  if (!list.length) { chips.innerHTML = ''; body.innerHTML = '<div class="msg">Nothing here yet.<br>New videos are added regularly!</div>'; return; }
  list.forEach(v => { if (!v.category) v.category = 'Other'; });
  const cats = [...new Set(list.map(v => v.category))].sort((a, b) => { const x = CAT_ORDER.indexOf(a), y = CAT_ORDER.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
  if (L.cat !== 'All' && !cats.includes(L.cat)) L.cat = 'All';
  chips.innerHTML = ['All', ...cats].map(c => `<button class="chip ${c === L.cat ? 'on' : ''}" data-act="cat" data-k="${k}" data-id="${esc(c)}">${c === 'All' ? '✨' : icon(c)} ${esc(c)}</button>`).join('');
  const q = L.q.toLowerCase();
  if (L.cat === 'All' && !q) {
    body.innerHTML = heroHtml(k, list.slice(0, 5)) + cats.map(c => {
      const items = list.filter(v => v.category === c);
      return `<div class="sh"><h2>${icon(c)} ${esc(c)}</h2>${items.length > 6 ? `<button data-act="cat" data-k="${k}" data-id="${esc(c)}">See all ›</button>` : ''}</div><div class="row">${items.slice(0, 14).map(v => card(k, v)).join('')}</div>`;
    }).join('');
    startHero(); return;
  }
  clearInterval(state.heroT);
  const f = list.filter(v => (L.cat === 'All' || v.category === L.cat) && (!q || String(v.title).toLowerCase().includes(q)));
  body.innerHTML = f.length
    ? `<div class="${k === 'yt' ? 'grid2' : 'grid3'}" style="margin-top:14px">${f.slice(0, L.shown).map(v => card(k, v)).join('')}</div>${L.shown < f.length ? `<button class="btn more" data-act="more" data-k="${k}">Load more</button>` : ''}`
    : '<div class="msg">Nothing found.</div>';
}

// ───── Ads section ─────
function tabAds() {
  $('#view').innerHTML = `
    <h2 style="margin-top:16px">Support NEWTUBE</h2>
    <p class="lead">NEWTUBE is free for everyone. Watching an ad here helps us keep adding new movies, anime and videos. Thank you ❤️</p>
    ${NETS.map(n => `<div class="card"><div class="ic">${n.icon}</div><div class="mid"><b>${n.name} ad</b><span>A short ad · tap to watch</span></div><button class="btn pri" data-act="ad" data-id="${n.id}">Watch</button></div>`).join('')}
    <div class="card" id="sp"><div class="ic">🎯</div><div class="mid"><b>Sponsored task</b><span>Try a partner offer</span></div>
      <adsgram-task class="adtask" data-block-id="${ADSGRAM_TASK}" data-debug="false"><span slot="reward"></span><div slot="button" class="btn pri">Open</div><div slot="claim" class="btn pri">Done</div><div slot="done" class="btn">✓</div></adsgram-task></div>`;
  const t = $('adsgram-task'); if (t) t.addEventListener('onBannerNotFound', () => { const c = $('#sp'); if (c) c.remove(); });
}

// ═════════ OVERLAY (movie details · player · profile) ═════════
function ov(html) { const o = $('#ov'); o.innerHTML = html; o.classList.add('on'); o.scrollTop = 0; document.body.classList.add('lock'); try { tg.BackButton.show(); } catch (e) {} }
function closeOv() { stopPlayer(); const o = $('#ov'); o.classList.remove('on'); o.innerHTML = ''; document.body.classList.remove('lock'); try { tg.BackButton.hide(); } catch (e) {} }
try { tg.BackButton.onClick(closeOv); } catch (e) {}

function openMovie(m) {
  state.cur = m;
  const canWatch = !!(m.streamUrl || m.watchLink);
  ov(`<div class="dh"><img src="${imgSrc(m.thumbnail)}" alt="" onerror="this.remove()"><div class="hg"></div><button class="x" data-act="close">✕</button></div>
    <div class="dbody"><span class="dcat">${icon(m.category)} ${esc(m.category || '')}</span><h1>${esc(m.title)}</h1>
    <div class="acts">${canWatch ? '<button class="btn pri" data-act="watch">▶ Watch</button>' : ''}${m.canDownload ? '<button class="btn" id="dlbtn" data-act="dl">⬇ Download</button>' : ''}</div>
    ${!canWatch && !m.canDownload ? '<p class="note">Not available yet.</p>' : ''}
    ${m.canDownload ? `<p class="note">Download: watch one short ad, then the file is sent to your chat with @${BOT}.</p>` : ''}</div>`);
}
// Watch a channel video in Telegram's own player (after one short ad)
async function watchInTelegram(m) {
  addHist('mv', m);
  if (Date.now() - state.lastAdAt > PREROLL_GAP_MS) { toast('A short ad, then your video…'); await sleep(2500); await showInterstitial(); state.lastAdAt = Date.now(); }
  try { tg.openTelegramLink(m.watchLink); } catch (e) { window.open(m.watchLink, '_blank'); }
}
function startWatch(m) { if (m.streamUrl) openPlayer(m, 'mv'); else if (m.watchLink) watchInTelegram(m); }

// ═════════ PLAYER (ad before play + one ad every 6 min with a 5-second warning) ═════════
function mediaCmd(c) {
  const f = $('#yt'); if (f && f.contentWindow) try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: c === 'p' ? 'pauseVideo' : 'playVideo', args: [] }), '*'); } catch (e) {}
  const v = $('#vid'); if (v) try { c === 'p' ? v.pause() : v.play(); } catch (e) {}
}
function stopPlayer() {
  state.ptoken++; clearInterval(state.tick); state.adBusy = false;
  const v = $('#vid'); if (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} }
  if (state.hls) { try { state.hls.destroy(); } catch (e) {} state.hls = null; }
}
async function adBreak(label, secs, token) {
  if (state.adBusy) return; state.adBusy = true; mediaCmd('p');
  const cd = $('#cd');
  try {
    if (cd) { cd.classList.add('on'); for (let s = secs; s > 0; s--) { cd.innerHTML = `<div class="cdn">${s}</div><div class="cdt">${label}</div>`; await sleep(1000); if (token !== state.ptoken) return; } cd.innerHTML = '<div class="cdt">Loading ad…</div>'; }
    await showInterstitial(); state.lastAdAt = Date.now();
  } finally { state.adBusy = false; if (cd) { cd.classList.remove('on'); cd.innerHTML = ''; } if (token === state.ptoken) mediaCmd('r'); }
}
function loadHls() {
  return new Promise((res, rej) => { if (window.Hls) return res(); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function openPlayer(item, kind) {
  stopPlayer(); const token = state.ptoken, isYT = kind === 'yt';
  const pool = LIB[kind].list || [];
  const others = pool.filter(x => x._id !== item._id && (isYT || x.streamUrl))
    .sort((a, b) => ((b.playlistId && b.playlistId === item.playlistId) | 0) - ((a.playlistId && a.playlistId === item.playlistId) | 0) || ((b.category === item.category) | 0) - ((a.category === item.category) | 0)).slice(0, 12);
  addHist(kind, item);
  ov(`<div class="ph"><button class="x" data-act="close">←</button><div class="pn">${esc(item.title)}</div></div>
    <div class="stage" id="stage"><div class="cd" id="cd"></div></div>
    <div class="pinfo"><h1>${esc(item.title)}</h1>${!isYT && item.canDownload ? '<div class="acts" style="margin-top:12px"><button class="btn" id="dlbtn" data-act="dl">⬇ Download</button></div>' : ''}</div>
    <div class="pbody">${others.length ? '<h2>Up next</h2>' + others.map(o => isYT
      ? `<div class="nx" data-act="play" data-id="${esc(o._id)}"><div class="th"><img loading="lazy" src="${ytThumb(o)}" alt="" onerror="this.remove()"></div><div class="tt">${esc(o.title)}</div></div>`
      : `<div class="nx" data-act="watch2" data-id="${esc(o._id)}"><div class="pth"><img loading="lazy" src="${imgSrc(o.thumbnail)}" alt="" onerror="this.remove()"></div><div class="tt">${esc(o.title)}</div></div>`).join('') : ''}</div>`);
  state.cur = item;
  // ad BEFORE the video (3-second heads-up so nobody taps the ad by accident)
  if (Date.now() - state.lastAdAt > PREROLL_GAP_MS) await adBreak('Your video starts after a short ad', 3, token);
  if (token !== state.ptoken) return;
  const stage = $('#stage'); if (!stage) return;
  if (isYT) {
    const src = item.videoId
      ? `https://www.youtube.com/embed/${encodeURIComponent(item.videoId)}?autoplay=1&playsinline=1&rel=0&enablejsapi=1`
      : `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(item.listId)}&autoplay=1&playsinline=1&rel=0&enablejsapi=1`;   // whole playlist, plays in order
    stage.insertAdjacentHTML('afterbegin', `<iframe id="yt" src="${src}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`);
  } else {
    stage.insertAdjacentHTML('afterbegin', `<video id="vid" controls playsinline autoplay></video>`);
    const vid = $('#vid'), url = item.streamUrl;
    if (/\.m3u8(\?|$)/i.test(url) && !vid.canPlayType('application/vnd.apple.mpegurl')) {
      try { await loadHls(); if (window.Hls && Hls.isSupported() && token === state.ptoken) { state.hls = new Hls(); state.hls.loadSource(url); state.hls.attachMedia(vid); } } catch (e) { toast('Couldn’t load this video'); }
    } else vid.src = url;
    vid.addEventListener('error', () => toast('This video couldn’t be loaded'));
  }
  // one ad break per 6 minutes of real watching
  let watched = 0;
  state.tick = setInterval(() => {
    if (token !== state.ptoken) return clearInterval(state.tick);
    const v = $('#vid');
    if (document.hidden || state.adBusy || (v && v.paused)) return;
    if (++watched >= AD_EVERY_SEC) { watched = 0; adBreak('Ad coming up…', 5, token); }
  }, 1000);
}

// ═════════ DOWNLOAD (block ad → bot sends the file to the user's chat) ═════════
async function download() {
  const m = state.cur; if (!m || !m.canDownload) return;
  if (!tg || !tg.initData) return toast('Open NEWTUBE inside Telegram to download');
  const btn = $('#dlbtn'); if (btn) btn.disabled = true;
  try {
    const ad = await showBlockAd();
    if (ad === 'closed') return toast('Please watch the whole ad to download');
    toast('Sending the file…');
    const r = await postData({ action: 'download', initData: tg.initData, id: m._id });
    if (r.ok) {
      store.set('nt_dl', (store.get('nt_dl', 0) || 0) + 1);
      toast(`✅ Sent! Check your chat with @${BOT}`);
      setTimeout(() => { try { tg.openTelegramLink('https://t.me/' + BOT); } catch (e) {} }, 1400);
    } else if (r.error === 'send_failed') {
      toast(`Press Start in @${BOT} first, then try again`);
      setTimeout(() => { try { tg.openTelegramLink('https://t.me/' + BOT); } catch (e) {} }, 1600);
    } else if (r.error === 'too_fast') toast('Please wait a few seconds');
    else toast('Couldn’t send the file. Please try again.');
  } finally { setTimeout(() => { const b = $('#dlbtn'); if (b) b.disabled = false; }, 4000); }
}

// ═════════ PROFILE (icon at the top) ═════════
const getHist = () => store.get('nt_hist', []);
function addHist(kind, item) {
  const h = getHist().filter(x => !(x.kind === kind && x.item._id === item._id));
  h.unshift({ kind, item: { _id: item._id, title: item.title, thumbnail: item.thumbnail, videoId: item.videoId, listId: item.listId, streamUrl: item.streamUrl, watchLink: item.watchLink, category: item.category, canDownload: item.canDownload } });
  store.set('nt_hist', h.slice(0, 20)); store.set('nt_watched', (store.get('nt_watched', 0) || 0) + 1);
}
function avatar() {
  const photo = /^https:\/\//.test(U.photo_url || '') ? U.photo_url : '';
  return photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : (U.first_name ? esc(U.first_name.charAt(0).toUpperCase()) : '👤');
}
function openProfile() {
  const h = getHist(), name = [U.first_name, U.last_name].filter(Boolean).join(' ') || 'Guest';
  ov(`<div class="ph"><button class="x" data-act="close">←</button><div class="pn">Profile</div></div>
    <div class="pbody"><div class="pav">${avatar()}</div><div class="pname">${esc(name)}</div>
    <div class="psub">${U.username ? '@' + esc(U.username) : ''}${U.username && U.id ? ' · ' : ''}${U.id ? 'ID ' + esc(U.id) : ''}</div>
    <div class="stats"><div><b>${store.get('nt_watched', 0) || 0}</b><span>Videos watched</span></div><div><b>${store.get('nt_dl', 0) || 0}</b><span>Downloads</span></div></div>
    ${h.length ? `<h2 style="margin-top:6px">Recently watched</h2>${h.slice(0, 10).map((x, i) => `<div class="nx" data-act="hist" data-id="${i}"><div class="th"><img loading="lazy" src="${x.kind === 'yt' ? ytThumb(x.item) : imgSrc(x.item.thumbnail)}" alt="" onerror="this.remove()"></div><div class="tt">${esc(x.item.title)}</div></div>`).join('')}<button class="btn" data-act="clear" style="margin-top:6px">Clear history</button>` : '<p class="lead" style="text-align:center">Your watch history will show up here.</p>'}</div>`);
}

// ═════════ EVENTS ═════════
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, k = a.dataset.k;
  const find = (list, i) => (list || []).find(x => x._id === i);
  if (act === 'tab') switchTab(id);
  else if (act === 'prof') openProfile();
  else if (act === 'close') closeOv();
  else if (act === 'retry') switchTab(state.tab);
  else if (act === 'play') { const v = find(LIB.yt.list, id); if (v) openPlayer(v, 'yt'); }
  else if (act === 'open') { const m = find(LIB.mv.list, id); if (m) openMovie(m); }
  else if (act === 'watch') { if (state.cur) startWatch(state.cur); }
  else if (act === 'watch2') { const m = find(LIB.mv.list, id); if (m) openPlayer(m, 'mv'); }
  else if (act === 'dl') download();
  else if (act === 'more') { LIB[k].shown += k === 'yt' ? PAGE : 18; paintLib(k); }
  else if (act === 'cat') { LIB[k].cat = id; LIB[k].shown = k === 'yt' ? PAGE : 18; paintLib(k); window.scrollTo(0, 0); }
  else if (act === 'ad') watchAd(id);
  else if (act === 'hist') {
    const x = getHist()[+id]; if (!x) return;
    if (x.kind === 'yt') { if (!LIB.yt.list.length) LIB.yt.list = [x.item]; openPlayer(x.item, 'yt'); }
    else if (x.item.streamUrl) { if (!LIB.mv.list.length) LIB.mv.list = [x.item]; openPlayer(x.item, 'mv'); }
    else openMovie(x.item);
  }
  else if (act === 'clear') { store.set('nt_hist', []); openProfile(); }
});

// ═════════ START — shows instantly, no login / server call needed ═════════
(function start() {
  $('#pbtn').innerHTML = avatar();
  drawNav(); switchTab('yt');
  getData('movies', list => { if (list && !(LIB.mv.list || []).length) LIB.mv.list = list; });   // warm the Videos library in the background
})();
</script>
