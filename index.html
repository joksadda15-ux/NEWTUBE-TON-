// HISTORY — withdraw request status (received / pending only)
// ══════════════════════════════════════════════════════════════
const HISTORY_STATUS_UI = {
    pending:  { label: 'Pending',  icon: '🕓', color: 'var(--signal)' },
    approved: { label: 'Received', icon: '✅', color: 'var(--success)' },
};
async function openHistoryModal() {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
        <div class="overlay">
            <div class="sheet" style="max-height:78vh; display:flex; flex-direction:column;">
                <div class="sheet-handle"></div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
                    <div style="font-family:var(--font-display); font-weight:700; font-size:18px;">🕓 Withdraw History</div>
                    <button class="icon-btn" onclick="document.getElementById('modal-root').innerHTML=''" aria-label="Close">✕</button>
                </div>
                <div id="history-list" style="overflow-y:auto; flex:1;">
                    <div class="muted" style="text-align:center; padding:30px 0;">Loading...</div>
                </div>
            </div>
        </div>`;

    try {
        const r = await apiGet(`withdraw?action=history&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        const listEl = document.getElementById('history-list');
        if (!listEl) return; // modal closed before response arrived

        // ⚠️ FIX: previously r.history was filtered directly without checking
        // r.ok first — so any auth/server error silently showed "no requests"
        // instead, and the real cause was never visible. Errors are now shown
        // explicitly and separately.
        if (!r.ok) {
            console.error('history fetch failed:', r.error, r.reason);
            listEl.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">Couldn't load history (${r.error || 'unknown'}). Close the app and reopen it.</div>`;
            return;
        }

        const items = (r.history || []).filter(h => h.status === 'pending' || h.status === 'approved');

        if (!items.length) {
            listEl.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">No withdraw requests yet.</div>`;
            return;
        }

        listEl.innerHTML = items.map((h, i) => {
            const st = HISTORY_STATUS_UI[h.status] || { label: h.status, icon: '•', color: 'var(--ink-muted)' };
            const date = h.createdAt ? new Date(h.createdAt).toLocaleString() : '';
            return `
                <div class="card" style="margin-bottom:10px; opacity:0; animation: jg-rise 0.35s ease ${Math.min(i * 0.05, 0.4)}s forwards;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div>
                            <div style="font-weight:700; font-size:15px;">$${Number(h.cashAmount ?? h.usdAmount ?? 0).toFixed(2)} ${h.currency || 'USDT'}</div>
                            <div class="muted" style="font-size:12px; margin-top:2px;">${(WITHDRAW_METHOD_LABELS[h.method] || h.method || '')} · ${date}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:${st.color}22; color:${st.color}; font-size:12px; font-weight:700; white-space:nowrap;">
                            ${st.icon} ${st.label}
                        </div>
                    </div>
                </div>`;
        }).join('');
    } catch (e) {
        const listEl = document.getElementById('history-list');
        if (listEl) listEl.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">Failed to load history.</div>`;
    }
}

function switchTab(tabId) {
    if (state.activeTab === 'home' && tabId !== 'home' && _tickerInterval) { clearInterval(_tickerInterval); _tickerInterval = null; }
    state.activeTab = tabId;
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
    const renderers = { home: renderHome, video: renderVideoTab, earning: renderEarningTab, task: renderTaskTab, refer: renderReferTab };
    renderers[tabId]();
    requestAnimationFrame(() => { document.getElementById('tab-content')?.classList.add('tab-fade'); });

// HOME — live "recently withdrawn" ticker (real approved withdraws, username masked)
// ══════════════════════════════════════════════════════════════
let _tickerInterval = null;
async function startWithdrawTicker() {
    if (_tickerInterval) { clearInterval(_tickerInterval); _tickerInterval = null; }
    const textEl = document.getElementById('wd-ticker-text');
    if (!textEl) return;

    let items = [];
    try {
        const r = await apiGet('data?type=recentWithdrawals');
        items = r.items || [];
    } catch { /* ignore — ticker just won't show */ }

    const liveTextEl = document.getElementById('wd-ticker-text'); // re-check, tab may have switched during fetch
    if (!liveTextEl) return;

    if (!items.length) {
        liveTextEl.textContent = '💸 Withdraw your earnings straight to TON/USDT!';
        return;
    }

    let idx = 0;
    const show = (i) => {
        const el = document.getElementById('wd-ticker-text');
        if (!el) { clearInterval(_tickerInterval); _tickerInterval = null; return; }
        const w = items[i];
        el.style.opacity = '0';
        setTimeout(() => {
            const el2 = document.getElementById('wd-ticker-text');
            if (!el2) return;
            el2.textContent = `${w.username} just withdrew ${Number(w.cashAmount).toFixed(2)} ${w.currency} 🎉`;
            el2.style.opacity = '1';
        }, 350);
    };
    show(idx);
    _tickerInterval = setInterval(() => { idx = (idx + 1) % items.length; show(idx); }, 3500);
}

        if (nums[0]) { nums[0].classList.remove('skel'); nums[0].style.cssText = ''; nums[0].textContent = videosRes.ok ? (videosRes.videos?.length || 0) : '—'; }
        if (nums[1]) { nums[1].classList.remove('skel'); nums[1].style.cssText = ''; nums[1].textContent = tasksRes.ok ? (tasksRes.tasks?.length || 0) : '—'; }
    })();
}

// Shared promo-redeem flow (ad-gate -> claim), used by BOTH the inline Home
// promo box and the openPromoModal() popup, so the anti-abuse "must watch an
// ad before the code is spent" behavior can't drift out of sync between them.
async function redeemPromoCode(code, btn, onSuccess) {
    if (!code) return toast('Please enter a code.', 'error');
    const originalLabel = btn.textContent;
    btn.textContent = 'Checking code...'; btn.disabled = true;

    // ⚠️ NEW — validate the code BEFORE showing an ad. Previously the ad
    // played no matter what, so an invalid/expired/already-used code still
    // cost the user a full ad watch before telling them it failed. This
    // check doesn't spend the code (see handleCheckPromo in api/earn.js) —
    // the real, atomic redemption still happens after the ad, below.
    const check = await apiPost('earn', { action: 'checkPromo', code });
    if (!check.ok) {
        toast(errorText(check.error), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    btn.textContent = 'Loading ad...';
    const candidates = [showAdsgramDailyAd, showGigaPubAd, showMonetagAd]; // ⚠️ FIX — showAdsgramSpecialAd no longer exists (network removed); swapped in showGigaPubAd
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    try {
        await pick();
    } catch (e) {
        toast(errorText(e.message), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    btn.textContent = 'Checking...';
    const r = await apiPost('earn', { action: 'claimPromo', code });
    if (r.ok) {
        toast(`+${r.reward} WTC added!`, 'success');
        triggerBurst(btn);
        showCongrats(`+${r.reward} WTC`, '🎁');
        await refreshUser();
        onSuccess?.();
    } else {
        toast(errorText(r.error), 'error');
    }
    btn.textContent = originalLabel; btn.disabled = false;
}

    binance:   { label: 'Binance UID', currency: 'USDT', placeholder: 'Enter your Binance UID',
                 icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 3-3 3-3-3 3-3zM12 16l3 3-3 3-3-3 3-3zM2 12l3-3 3 3-3 3-3-3zM16 12l3-3 3 3-3 3-3-3z"/></svg>' },

};

function calcNetUsdDisplay(wtc) {
    const gross = wtc / WTC_PER_USD_DISPLAY;
    const afterFirstFee = gross * (1 - WITHDRAW_FEE_PERCENT_DISPLAY / 100);
    const net = afterFirstFee * (1 - WITHDRAW_SECOND_FEE_PERCENT_DISPLAY / 100);
    return net;
}

function openWithdrawModal() {
    let method = 'binance';
    let status = null;       // full GET ?action=status response
    let loadFailed = false;
    let withdrawalsOpen = true;

    function renderClosed() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    <div style="position:relative; z-index:1; text-align:center; padding:12px 4px 4px;">
                        <div style="font-size:34px; margin-bottom:10px;">🔒</div>
                        <div class="section-title" style="margin-bottom:8px;">Withdrawals are closed</div>
                        <div class="muted" style="font-size:13px; line-height:1.6; margin-bottom:20px;">New withdraw requests aren't being accepted right now. Any request you already submitted before this will still be reviewed and paid normally.</div>
                        <button class="btn btn-outline" id="wd-closed-ok" style="width:100%;">Close</button>
                    </div>
                </div>
            </div>`;
        const okBtn = document.getElementById('wd-closed-ok');
        if (okBtn) okBtn.onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
    }

    function reqLine(label, met, detail) {
        return `
        <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px; color:${met ? 'var(--success)' : 'var(--pending)'};">
            <span>${met ? '✅' : '⏳'}</span><span>${label}${detail ? ` <span class="muted" style="color:inherit; opacity:0.85;">${detail}</span>` : ''}</span>
        </div>`;
    }

    function render() {
        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const m = WITHDRAW_METHODS_UI[method];

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="max-height:88vh; display:flex; flex-direction:column; position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    <div class="section-title" style="margin-bottom:14px; position:relative; z-index:1;">Withdraw WTC</div>

                    <div style="overflow-y:auto; flex:1; position:relative; z-index:1;">
                        <div class="field-label" style="margin-top:0;">Select gateway</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                            ${Object.entries(WITHDRAW_METHODS_UI).map(([key, cfg]) => `
                                <button class="btn ${method === key ? 'btn-primary' : 'btn-outline'}" data-method="${key}" style="display:flex; align-items:center; justify-content:center; gap:7px; height:56px; flex-direction:column; font-size:12px;">
                                    ${cfg.icon}${cfg.label.split(' ')[0]}
                                </button>`).join('')}
                        </div>

                        <div class="field-label">${m.label}</div>
                        <input class="field-input" id="wd-details" placeholder="${m.placeholder}">

                        <div class="field-label">Amount (WTC) — minimum ${fmtWTC(MIN_WITHDRAW_WTC)}</div>
                        <div style="display:flex; gap:8px;">
                            <input class="field-input" id="wd-amount" type="number" placeholder="${MIN_WITHDRAW_WTC}" style="flex:1;">
                            <button class="btn btn-outline" id="wd-max" style="width:auto; padding:0 16px;">MAX</button>
                        </div>
                        <div class="muted" style="font-size:11px; margin-top:5px;">${fmtWTC(WTC_PER_USD_DISPLAY)} WTC = 1 USDT · Balance: <span class="mono-num">${fmtWTC(wtcBalance)} WTC</span></div>

                        <div class="card" style="margin-top:14px; padding:12px 14px;">
                            ${!status ? `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0;">${loadFailed ? "Couldn't load — try again." : 'Loading requirements...'}</div>` : `
                                ${reqLine(`Complete ${status.withdrawRequirements.tasksRequired} tasks today`, status.withdrawRequirements.tasksMet, `(${status.withdrawRequirements.tasksHave}/${status.withdrawRequirements.tasksRequired})`)}
                                ${reqLine(`Watch ${status.withdrawRequirements.adsRequired} ads today`, status.withdrawRequirements.adsMet, `(${status.withdrawRequirements.adsWatchedToday}/${status.withdrawRequirements.adsRequired})`)}
                                ${status.referralRequirement.isFirstWithdrawFree
                                    ? reqLine(`First withdrawal — free, up to ${fmtWTC(status.referralRequirement.firstWithdrawMaxWtc)} WTC`, true, '')
                                    : reqLine('Valid referral available', status.referralRequirement.met, `(${status.referralRequirement.validReferralsAvailable} available)`)}
                            `}
                        </div>

                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
                            <span class="muted" style="font-size:13px;">You receive</span>
                            <span id="wd-receive" class="mono-num" style="font-size:18px; font-weight:700; color:var(--money);">$0.0000</span>
                        </div>
                        <div class="muted" style="font-size:10.5px; margin-top:4px;">Fees: ${WITHDRAW_FEE_PERCENT_DISPLAY}% + ${WITHDRAW_SECOND_FEE_PERCENT_DISPLAY}%, taken together at withdraw time.</div>
                    </div>

                    <button class="btn btn-money" style="margin-top:14px; position:relative; z-index:1;" id="wd-submit" disabled>Loading...</button>
                </div>
            </div>`;

        document.querySelectorAll('[data-method]').forEach(btn => {
            btn.onclick = () => { method = btn.dataset.method; render(); };
        });
        document.getElementById('wd-max').onclick = () => {
            // ⚠️ NEW — for a first-time (free) withdrawal, MAX shouldn't
            // fill in more than the free cap, or it'd just disable the
            // submit button immediately.
            const cap = (status?.referralRequirement?.isFirstWithdrawFree)
                ? Math.min(wtcBalance, status.referralRequirement.firstWithdrawMaxWtc)
                : wtcBalance;
            document.getElementById('wd-amount').value = Math.floor(cap);
            updateReceiveAndSubmit();
        };
        document.getElementById('wd-amount').oninput = updateReceiveAndSubmit;
        document.getElementById('wd-submit').onclick = submitWithdraw;
        updateReceiveAndSubmit();
    }

    function updateReceiveAndSubmit() {
        const amountEl = document.getElementById('wd-amount');
        const btn = document.getElementById('wd-submit');
        const receiveEl = document.getElementById('wd-receive');
        if (!amountEl || !btn) return;

        const wtc = Math.floor(parseFloat(amountEl.value) || 0);
        receiveEl.textContent = `$${calcNetUsdDisplay(wtc).toFixed(4)}`;

        if (!status) { btn.disabled = true; btn.textContent = loadFailed ? 'Retry' : 'Loading...'; return; }

        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const reqOk = status.withdrawRequirements.adsMet && status.withdrawRequirements.tasksMet;
        const refOk = status.referralRequirement.met;

        if (loadFailed) { btn.disabled = false; btn.textContent = 'Retry'; return; }
        if (wtc < MIN_WITHDRAW_WTC) { btn.disabled = true; btn.textContent = `Minimum ${fmtWTC(MIN_WITHDRAW_WTC)} WTC`; return; }
        if (wtc > wtcBalance) { btn.disabled = true; btn.textContent = 'Insufficient WTC balance'; return; }
        // ⚠️ NEW — the free first withdrawal is capped; catch it client-side
        // too so the button disables instead of letting the user submit and
        // only then find out from the server.
        if (status.referralRequirement.isFirstWithdrawFree && wtc > status.referralRequirement.firstWithdrawMaxWtc) {
            btn.disabled = true; btn.textContent = `Free first withdrawal capped at ${fmtWTC(status.referralRequirement.firstWithdrawMaxWtc)} WTC`; return;
        }
        if (!reqOk) { btn.disabled = true; btn.textContent = 'Complete requirements above'; return; }
        if (!refOk) { btn.disabled = true; btn.textContent = 'Need 1 valid referral'; return; }
        btn.disabled = false;
        btn.textContent = `Withdraw ${fmtWTC(wtc)} WTC`;
    }

    async function loadStatus() {
        const r = await apiGet(`withdraw?action=status&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (!r.ok) {
            loadFailed = true;
            updateReceiveAndSubmit();
            return;
        }
        if (r.withdrawalsOpen === false) {
            withdrawalsOpen = false;
            renderClosed();
            return;
        }
        loadFailed = false;
        status = r;
        render();
    }

    async function submitWithdraw() {
        const details = document.getElementById('wd-details').value.trim();
        const wtcAmount = Math.floor(parseFloat(document.getElementById('wd-amount').value) || 0);
        if (loadFailed) { loadStatus(); return; }
        if (!details) return toast('Please enter your address/UID.', 'error');
        if (!wtcAmount) return toast('Please enter an amount.', 'error');

        const btn = document.getElementById('wd-submit');
        btn.textContent = 'Submitting...'; btn.disabled = true;
        const r = await apiPost('withdraw', { method, details, wtcAmount });
        if (r.ok) {
            toast('Withdraw request submitted — you\'ll be paid once approved.', 'success');
            triggerBurst(btn);
            setTimeout(() => { document.getElementById('modal-root').innerHTML = ''; }, 200);
            await refreshUser();
            if (state.activeTab === 'home') renderHome();
        } else {
            toast(r.message || errorText(r.error), 'error');
            await loadStatus();
        }
    }

    render();
    loadStatus();
}

    state.videos = r.ok ? seededShuffle(r.videos, todayStr()) : [];

        grid.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">No videos available yet.</div>`;

// Yields the same permutation for everyone all day, then a different one
// tomorrow — a tiny linear-congruential PRNG seeded from the date string,
// no crypto needed since this is just display order, not anything security-sensitive.
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function seededShuffle(arr, seedStr) {
    let seed = 0;
    for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
    const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return seed / 4294967296; };
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
}

async function tryClaimLootbox() {
    const pending = state.user?.pendingVideoWTC || 0;
    if (pending < 25) { toast(`You need at least 25 WTC to claim (currently ${fmtWTC(pending)}).`, 'info'); return; }

    // ⚠️ SECURITY FIX — request a signed token FIRST (before the ad even
    // loads), same pattern as watchAdNetwork's adStart. The server checks
    // real elapsed time between this and the claim call, so the ad can't be
    // skipped by calling claimLootbox directly.
    const startRes = await apiPost('earn', { action: 'lootboxAdStart' });
    if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }

    // Show one random real ad (Adsgram or Monetag) before granting the reward —
    // the reward only fires after the ad SDK's promise actually resolves.
    const candidates = [showAdsgramDailyAd, showGigaPubAd, showMonetagAd]; // ⚠️ FIX — showAdsgramSpecialAd no longer exists (network removed); swapped in showGigaPubAd
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    toast('Loading ad...', 'info');
    try {
        await pick();
        await claimLootboxNow(startRes.startTime, startRes.signature);
    } catch (e) {
        toast(errorText(e.message), 'error');
    }
}

async function claimLootboxNow(startTime, signature) {
    const r = await apiPost('earn', { action: 'claimLootbox', startTime, signature });
    if (r.ok) {
        state._lootboxNudgeShown = false;
        toast(`+${fmtWTC(r.pointsAdded)} WTC added to your balance!`, 'success');
        triggerBurst(document.getElementById('floating-lootbox'));
        showCongrats(`+${fmtWTC(r.pointsAdded)} WTC`, '🪙');
        await refreshUser();
        renderFloatingLootbox();
        if (state.activeTab === 'home') renderHome();
    } else { toast(errorText(r.error), 'error'); }
}

let sessionEarnedTotal = 0;
let sessionDisplayWTC = 0; // visual only — increments every 10s for mining feel
let videoWatchSeconds = 0;
let lastMonetagInterstitialAt = 0;

function updateLootboxFullUI(isFull) {
    const banner = document.getElementById('vp-lootbox-full-banner');
    const sub = document.getElementById('vp-session-sub');
    if (!banner || !sub) return;
    banner.style.display = isFull ? 'block' : 'none';
    sub.textContent = isFull ? 'Paused — claim your lootbox to resume earning' : '50 WTC earned per hour watched';
}

async function startVideoSession() {
    sessionEarnedTotal = 0;
    sessionDisplayWTC = 0;
    videoWatchSeconds = 0;
    lastMonetagInterstitialAt = 0;
    const startRes = await apiPost('earn', { action: 'videoStart' }); // ⚠️ CHANGED — userId no longer sent; server now derives it from verified initData only (see api/earn.js)
    if (!startRes.success) { toast(errorText(startRes.error), 'error'); return; }
    state.videoSession = { startTime: startRes.startTime, signature: startRes.signature };
    updateLootboxFullUI((state.user?.pendingVideoWTC || 0) >= 25);

    // ── Visual counter: every 10 seconds, adds ~0.139 WTC (= 50 WTC/hr / 360 ticks/hr)
    // This is purely for display — it makes the UI feel like a miner ticking up.
    // The real WTC is only credited by the 30-second backend call below.
    // ⚠️ FIX: this used to keep climbing even after the backend stopped crediting
    // (once pendingVideoWTC hits the 25 WTC claim threshold), so the video page
    // could show e.g. "90 WTC" for a full hour watched while the real claimable
    // amount silently capped out much lower — a confusing "where did my WTC go"
    // moment when the user went back to actually claim. Now the ticker freezes
    // (and shows the same lootbox-full banner) the instant the real cap is hit,
    // so the number on screen is always the number they'll actually get.
    state.videoDisplayInterval = setInterval(() => {
        if (!state.videoSession) return;
        if ((state.user?.pendingVideoWTC || 0) >= 25) { updateLootboxFullUI(true); return; }
        sessionDisplayWTC = parseFloat((sessionDisplayWTC + 0.139).toFixed(3));
        const out = document.getElementById('vp-session-wtc');
        if (out) out.textContent = `${sessionDisplayWTC.toFixed(1)} WTC`;
    }, 10000);

    // ── Backend API: every 30 seconds, actually credits WTC to pendingVideoWTC ──
    state.videoSessionInterval = setInterval(async () => {
        if (!state.videoSession) return;
        videoWatchSeconds += 30;

    // ⚠️ REMOVED (this update) — this used to fire a Monetag interstitial
    // automatically every 6 minutes during video watching, with zero user
    // action and zero reward tied to it. Users were getting hit with
    // surprise full-screen ads while just watching videos (on top of
    // Adexium's own already-unpredictable pop-ins), which is exactly the
    // kind of thing that makes someone close the app and never reopen it.
    // GigaPub was checked too — it's never auto-triggered anywhere in this
    // file (showGigaPubAd only ever runs when the user explicitly claims a
    // task/bonus that's gated behind watching one ad). If GigaPub ads are
    // still popping up unprompted, that's coming from GigaPub's own script
    // (an auto/passive ad format enabled on their dashboard), not from
    // this codebase — worth checking GigaPub's publisher settings for an
    // "auto-show" or "in-page push" toggle to turn off.

        const elapsedSec = Math.floor((Date.now() - state.videoSession.startTime) / 1000);
        const claimable = Math.floor(elapsedSec * (50 / 3600)); // 50 WTC/hr — matches backend VIDEO_WTC_PER_SECOND (lib/constants.js)
        if (claimable <= 0) return;

        // ⚠️ NEW: once 25+ WTC is already sitting unclaimed in the lootbox, the
        // backend won't credit more anyway — skip the call, keep the video
        // session alive (so it resumes right after they claim), and nudge them
        // once (not every 30s, to avoid spamming toasts).
        if ((state.user?.pendingVideoWTC || 0) >= 25) {
            updateLootboxFullUI(true);
            if (!state._lootboxNudgeShown) {
                state._lootboxNudgeShown = true;
                toast('🎁 Your lootbox is full — claim it to keep earning!', 'info');
            }
            return;
        }
        updateLootboxFullUI(false);

        const r = await apiPost('earn', { action: 'videoClaim', startTime: state.videoSession.startTime, signature: state.videoSession.signature, claimedPoints: claimable });
        if (r.ok) {
            sessionEarnedTotal += claimable;
            // Sync display to actual earned value after each real credit
            sessionDisplayWTC = Math.max(sessionDisplayWTC, sessionEarnedTotal);
            const out = document.getElementById('vp-session-wtc');
            if (out) out.textContent = `${sessionDisplayWTC.toFixed(1)} WTC`;
            if (state.user) state.user.pendingVideoWTC = r.pendingVideoWTC;
            renderFloatingLootbox();
            showLootboxGain(claimable);
            const fresh = await apiPost('earn', { action: 'videoStart' });
            if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
        } else if (r.error === 'lootbox_claim_required') {
            updateLootboxFullUI(true);
            if (!state._lootboxNudgeShown) {
                state._lootboxNudgeShown = true;
                toast('🎁 Your lootbox is full — claim it to keep earning!', 'info');
            }
        } else if (r.error === 'video_token_expired' || r.error === 'invalid_signature') {
            // ⚠️ NEW — self-heal: this can legitimately happen if the tab was
            // backgrounded/throttled past the 5-minute token expiry (see
            // api/earn.js handleVideoClaim). Just get a fresh token silently
            // and keep the session going — the elapsed time already missed
            // is genuinely lost (by design, same as every other ad/task
            // token here), but there's no reason to make the user restart
            // watching from scratch over it.
            const fresh = await apiPost('earn', { action: 'videoStart' });
            if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
        }
    }, 30000);
}

function closeVideoPlayer() {
    if (state.videoSessionInterval) clearInterval(state.videoSessionInterval);
    if (state.videoDisplayInterval) clearInterval(state.videoDisplayInterval);
    state.videoSession = null;
    document.getElementById('modal-root').innerHTML = '';
    renderVideoTab();
}

        btn.onclick = () => watchAdNetwork(btn.dataset.network);
    });
}

// ⚠️ SECURITY FIX — now requests a signed ad-token from the server BEFORE
// showing the ad (adStart), and passes that exact token through to
// creditAdReward afterward. A bare "network name" is no longer enough to
// get a reward — see api/earn.js.
async function watchAdNetwork(network) {
    const showFn = AD_SHOW_FUNCTIONS[network];
    const networkLabel = AD_NETWORKS_UI.find(n => n.id === network)?.label || network;
    toast(`Loading ${networkLabel} ad...`, 'info');
    try {
        const startRes = await apiPost('earn', { action: 'adStart', network });
        if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }
        await showFn();
        await creditAdReward(network, startRes.startTime, startRes.signature);
    } catch (e) {
        // A network-specific, explicit message — a different network's ad is
        // never played instead; on failure the user is told directly to try
        // again or pick a different option.
        toast(`${networkLabel} ad isn't available right now. Please try again or pick a different network.`, 'error');
    }
}

async function creditAdReward(network, startTime, signature) {
    const r = await apiPost('earn', { action: 'claimAdReward', network, startTime, signature });
    if (r.ok) {
        toast(`+${r.reward} WTC added! (${r.countToday}/${r.dailyLimit})`, 'success');
        triggerBurst(document.querySelector(`button[data-network="${network}"]`));
        showCongrats(`+${r.reward} WTC`, '📺');
        await refreshUser();
        renderEarningTab();
    } else { toast(errorText(r.error), 'error'); }
}

async function renderTaskTab() {
    removeFloatingLootbox();
    // ⚠️ UPDATED — Daily task panel removed fully. The dedicated "✅ Verify"
    // (channel-join) tab was removed too (per request — only the tab/button
    // is gone; the underlying api-verify mechanism stays, since
    // Exclusive/Partner/Earning tasks can still individually be marked
    // API-verified from the admin panel). Task section now shows 3 tabs.
    // Any pre-existing 'channel'-category tasks in the DB no longer show
    // anywhere in the app — admin can still remove them via Manage Tasks →
    // ✅ Verify in the admin panel.
    const TASK_TABS = [
        { id: 'exclusive', label: '⭐ Exclusive' },
        { id: 'partner', label: '🤝 Partner' },
        { id: 'earning', label: '👥 Earning' },
    ];
    if (!state.taskSubTab || !TASK_TABS.some(t => t.id === state.taskSubTab)) state.taskSubTab = 'exclusive';
    const root = document.getElementById('tab-content');
    root.innerHTML = `
        <div class="section-pad" style="margin-top:18px;">
            <div class="section-title" style="margin-bottom:14px;">Complete tasks, earn WTC</div>
            <div class="subnav">
                ${TASK_TABS.map(t => `<button class="subnav-btn ${state.taskSubTab === t.id ? 'active' : ''}" data-subtab="${t.id}">${t.label}</button>`).join('')}
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;" id="task-page-list">
                <div class="muted" style="text-align:center; padding:20px 0;">Loading...</div>
            </div>
        </div>`;

    root.querySelectorAll('.subnav-btn[data-subtab]').forEach(btn => {
        btn.onclick = () => { state.taskSubTab = btn.dataset.subtab; renderTaskTab(); };
    });

    const r = await apiGet('data?type=tasks');
    state.tasks = r.ok ? r.tasks : [];
    const done = new Set(state.user?.completedTasks || []);
    const listEl = document.getElementById('task-page-list');
    if (!listEl) return; // sub-tab may have changed while this was loading

    // ⚠️ A completed task is no longer shown in the list — after it vanishes
    // with an animation this is the intended behavior, so it's filtered out
    // right here.
    const items = state.tasks.filter(t => !done.has(t._id) && (t.category || 'partner') === state.taskSubTab);

    if (!items.length) {
        listEl.innerHTML = `<div class="muted" style="text-align:center; padding:20px 0;">No tasks in this category right now — check back later.</div>`;
        return;
    }
    listEl.innerHTML = items.map(t => taskCardHtml(t)).join('');
    listEl.querySelectorAll('button[data-task]').forEach(btn => { btn.onclick = () => goToTask(btn.dataset.task, btn.dataset.url, btn.dataset.category, btn.dataset.verify); });
}

// meta per category: icon, badge text, and the CSS hue vars from the theme
// (see the --daily-hue/--exclusive-hue/etc. block up top).
const TASK_CATEGORY_META = {

    daily:     { icon: '📅', badge: 'Daily',       hue: 'var(--daily-hue)',     hueSoft: 'var(--daily-soft)' },

function taskCardHtml(t) {
    const cat = t.category || 'partner';

    // Falls back to the old category-based rule for tasks saved before this
    // field existed.
    const verifyType = t.verifyType || (cat === 'channel' ? 'api' : 'link');
    // daily tasks priced in USDT show the USDT figure as the headline reward
    // (with WTC as the small unit label swapped for "USDT") — the actual
    // credited amount is still rewardWtc under the hood, this is display-only.
    const isUsdt = t.rewardCurrency === 'usdt';

    const rewardUnit = isUsdt ? 'USDT' : 'WTC';
    return `

}

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    // Then show the claim/verify sheet — user must actively press Claim
    const task = state.tasks.find(t => t._id === taskId);
    // ⚠️ CHANGED (this update) — was `category === 'channel'`. Now keyed off
    // verifyType so any category (Daily/Exclusive/Partner/Earning) can be an
    // API-verified (Telegram join) task, not just the dedicated Verify tab.
    const isVerified = verifyType === 'api';

    // ⚠️ NEW — issue a signed taskStart token the instant the sheet opens
    // (non-API-verified tasks only — API-verified tasks are independently
    // verified via real Telegram membership and don't need this). Stored in a
    // closure-scoped variable and sent along with the claim below — see
    // handleTaskStart/handleTaskComplete in api/earn.js for why.
    let taskToken = null;
    if (!isVerified) {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (r?.ok) taskToken = { startTime: r.startTime, signature: r.signature };
        });
    }

    document.getElementById('modal-root').innerHTML = `
        <div class="overlay" onclick="if(event.target===this)this.remove()">
            <div class="sheet anim-in">
                <div class="sheet-handle"></div>
                <div style="font-weight:600; font-size:16px; margin-bottom:6px;">${task?.title || 'Task'}</div>
                <div class="muted" style="font-size:13px; margin-bottom:18px;">
                    ${isVerified
                        ? 'After joining the channel/group, tap Verify below. Our server will check your membership.'
                        : 'After completing the task above, tap Claim to receive your reward.'}
                </div>
                ${isVerified ? `
                    <button class="btn btn-signal" id="task-verify-btn" style="margin-bottom:10px;">
                        ✅ Verify Membership
                    </button>` : `
                    <button class="btn btn-primary" id="task-claim-btn" style="margin-bottom:10px;" disabled>
                        🎁 Claim in <span id="task-claim-countdown">5</span>s
                    </button>`}
                <button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''">
                    Cancel
                </button>
            </div>
        </div>`;

    const actionBtn = document.getElementById('task-verify-btn') || document.getElementById('task-claim-btn');
    if (actionBtn) {
        actionBtn.onclick = async () => {
            actionBtn.disabled = true;
            actionBtn.textContent = 'Checking...';
            await completeTask(taskId, taskToken);
        };
    }

    // ⚠️ Soft anti-abuse friction (matches the read→wait→claim pattern from
    // reference apps) — link-based tasks can't be server-verified (we can't
    // confirm someone actually visited an external site), so this at least
    // stops instant claim-without-clicking. It's not real verification, just
    // a reasonable minimum.
    const claimBtn = document.getElementById('task-claim-btn');
    if (claimBtn) {
        let remaining = 5; // ⚠️ CHANGED — was 10s (per admin request). See TASK_MIN_WAIT_SECONDS in lib/constants.js, lowered to match.
        const countdownEl = document.getElementById('task-claim-countdown');
        const timer = setInterval(() => {
            remaining--;
            if (!document.getElementById('task-claim-countdown')) { clearInterval(timer); return; }
            if (remaining <= 0) {
                clearInterval(timer);
                claimBtn.disabled = false;
                claimBtn.innerHTML = '🎁 Claim Reward';
            } else {
                countdownEl.textContent = remaining;
            }
        }, 1000);
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} WTC added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} WTC`, '✅');
        await refreshUser();

        // ── Vanishes the completed task's card with an animation, then refreshes the list ──
        const refreshActiveTab = () => {
            if (state.activeTab === 'earning') renderEarningTab();
            else if (state.activeTab === 'task') renderTaskTab();
        };
        const card = document.querySelector(`[data-task-card="${taskId}"]`);
        if (card) {
            card.classList.add('task-vanish');
            setTimeout(refreshActiveTab, 480);
        } else {
            refreshActiveTab();
        }
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

            <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--coin);">Connection Problem</div>
            <div class="muted" style="font-size:13.5px; line-height:1.7; margin-top:10px; max-width:320px;">Couldn't reach the server — your connection might be slow or unstable right now.</div>
            <button class="btn btn-primary" id="conn-retry-btn" style="max-width:340px; margin-top:22px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Try again
            </button>
        </div>`;
    document.getElementById('conn-retry-btn').onclick = () => { location.reload(); };
}

function showIpInUseScreen(owner) {
    const initials = (owner?.firstName || '?').trim().charAt(0).toUpperCase();
    const handle = owner?.telegramUsername ? `@${owner.telegramUsername}` : 'private';
    document.getElementById('app-root').innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; text-align:center;">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--coin)" stroke-width="2" style="margin-bottom:18px;"><path d="M5 12.5a11 11 0 0114 0M8.5 16a6 6 0 017 0"/><circle cx="12" cy="19.5" r="1.2" fill="var(--coin)" stroke="none"/></svg>
            <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--coin);">Device Already In Use</div>
            <div class="muted" style="font-size:13.5px; line-height:1.7; margin-top:10px; max-width:320px;">This device is already linked to another account.<br>Log in with that account, or claim this device for this one below.</div>

            <div class="card" style="width:100%; max-width:340px; margin-top:24px; text-align:left; display:flex; align-items:center; gap:12px;">
                <div style="width:42px; height:42px; border-radius:50%; background:var(--coin-soft); color:var(--coin); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); flex-shrink:0;">${initials}</div>
                <div style="flex:1; min-width:0;">
                    <div style="font-weight:600; font-size:14px;">${owner?.firstName || 'Unknown user'}</div>
                    <div class="muted" style="font-size:12px;">${handle} · ID <span class="mono-num">${owner?.id || '—'}</span></div>
                </div>
            </div>

            <button class="btn btn-primary" id="ip-retry-btn" style="max-width:340px; margin-top:22px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Try again
            </button>
            <button class="btn btn-outline" id="ip-switch-btn" style="max-width:340px; margin-top:10px;">Switch account (resets my balance)</button>
            <div class="muted" style="font-size:11px; margin-top:14px; max-width:320px; line-height:1.6;">Switching claims this connection for your account but resets your WTC and USDT balance to zero.</div>
        </div>`;

    document.getElementById('ip-retry-btn').onclick = () => { location.reload(); };
    document.getElementById('ip-switch-btn').onclick = async (e) => {
        const confirmed = await new Promise((resolve) => {
            if (tg?.showConfirm) tg.showConfirm('This will reset your entire balance to zero. Continue?', resolve);
            else resolve(confirm('This will reset your entire balance to zero. Continue?'));
        });
        if (!confirmed) return;
        e.target.disabled = true;
        e.target.textContent = 'Switching…';
        const r = await apiPost('user', { action: 'switchAccount', initData: TG_INIT_DATA, fingerprint: await generateDeviceFingerprint() });
        if (r && r.ok) {
            location.reload();
        } else {
            toast(r?.error || 'Could not switch account', 'error');
            e.target.disabled = false;
            e.target.textContent = 'Switch account (resets my balance)';
        }
    };
}

async function refreshUser() {
    const r = await apiGet(`user?action=profile&initData=${encodeURIComponent(TG_INIT_DATA)}`);
    if (r.ok) {
        state.user = r.user;
        // Ban gate — if user is banned, show ban screen and stop everything
        if (r.user?.isBanned) {
            document.getElementById('app-root').innerHTML = '';
            const appealUrl = `https://t.me/NewTube12_bot?start=appeal_${USER_ID}`;
            document.getElementById('modal-root').innerHTML = `
                <div style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:999;">
                    <div style="font-size:52px;margin-bottom:20px;">⛔</div>
                    <div style="font-family:var(--font-display);font-weight:700;font-size:22px;margin-bottom:12px;">Account Banned</div>
                    <div style="color:var(--ink-muted);font-size:14px;line-height:1.7;margin-bottom:24px;">Your account has been banned for using multiple accounts on the same device.<br><br>If you believe this is a mistake, tap below to request a review from the admin.</div>
                    <a href="${appealUrl}" target="_blank" class="btn btn-primary" style="width:auto; padding:0 22px; text-decoration:none;">🆘 Request Review</a>
                </div>`;
            throw new Error('banned'); // stop further execution in init()
        }
        return;
    }
    // ⚠️ FIX — previously, if r.ok was false (network timeout, 500, cold-start
    // failure, etc.) this function just silently returned with state.user
    // left unset — no error, no retry, nothing. init() would then carry on as
    // if everything succeeded. Now it throws, so init()'s catch block below
    // can show a real "connection failed, tap to retry" screen instead of
    // either hanging or silently rendering a broken/empty app.
    throw new Error(r.error === 'timeout' ? 'connection_timeout' : 'connection_failed');
}

async function init() {
    const splashStart = performance.now();

    // ── Telegram-only gate ── matches the original app's behavior: wait briefly
    // for Telegram's WebApp bridge to deliver initData, and if it never does
    // (because this was opened in a regular browser, not via Telegram), block
    // entirely instead of silently falling back to a fake/demo identity.
    if (!hydrateDisplayUserFields()) {
        await new Promise(r => setTimeout(r, 800));
        if (!hydrateDisplayUserFields()) {
            await new Promise(r => setTimeout(r, 1500));
        }
    }
    if (!TG_INIT_DATA || !hydrateDisplayUserFields()) {
        document.getElementById('splash').remove();
        document.getElementById('app-root').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; text-align:center; padding:0 30px;">
                <div style="font-size:48px;">📱</div>
                <div style="font-family:var(--font-display); font-weight:700; font-size:17px;">Open this in Telegram</div>
                <div class="muted" style="font-size:13px; line-height:1.6;">NEWTUBE only works inside the Telegram app. Please open it via the NEWTUBE bot.</div>
            </div>`;
        return;
    }

    const initRes = await apiPost('user', { action: 'init', fingerprint: await generateDeviceFingerprint() });
    if (initRes && initRes.ok === false && initRes.error === 'ip_in_use') {
        const splashEl = document.getElementById('splash');
        if (splashEl) splashEl.remove();
        showIpInUseScreen(initRes.owner);
        return;
    }
    // ⚠️ FIX — any OTHER init failure (timeout, 500, cold-start DB error, etc.)
    // used to be silently ignored here — execution just carried on into
    // refreshUser() as if init had succeeded. Now any non-ip_in_use failure
    // goes straight to the retry screen instead of limping forward.
    if (!initRes || initRes.ok === false) {
        showConnectionErrorScreen();
        return;
    }
    try {
        await refreshUser();
    } catch (e) {
        if (e.message === 'banned') {
            // Ban screen already shown in refreshUser() — remove splash and stop
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('out'); setTimeout(() => splash.remove(), 550); }
            return;
        }
        // ⚠️ FIX — connection_timeout / connection_failed / any other unexpected
        // error now shows a visible retry screen instead of either hanging on
        // the static "92%" splash forever (old timeout-less fetch) or, if it
        // did resolve, silently proceeding with no user data and breaking
        // downstream renders with no explanation to the user.
        showConnectionErrorScreen();
        return;
    }

    // Splash stays for at least 900ms so its entrance animation is always seen,
    // even when the network is fast — avoids an abrupt flash-then-gone feel.
    const elapsed = performance.now() - splashStart;
    if (elapsed < 900) await new Promise(r => setTimeout(r, 900 - elapsed));
    const splash = document.getElementById('splash');
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 550);

    showOnboarding(async () => {
        const joinCheck = await apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (joinCheck.joined) startApp();
        else showJoinGate({ leftAfterVerifying: joinCheck.leftAfterVerifying }, startApp);
    });
}

function startApp() {
    renderShell();
    switchTab('home');
    startJoinWatcher();
    setTimeout(checkPendingGift, 900); // after the splash/home entrance animation, so the two don't show at once
}

// ⚠️ FIX — pure canvas+screen+locale+timezone+cores fingerprinting collides
// across DIFFERENT physical devices when the hardware/software is common
// (same cheap Android model, same GPU, same Asia/Dhaka timezone, same bn/en
// locale — exactly the typical profile for our user base). That made the
// "device already in use" gate hard-block genuinely different people on
// genuinely different phones, which is what was being reported as false
// account suspensions.
//
// Fix: mix in a random, install-scoped ID that's generated once and
// persisted in localStorage. This is the dominant entropy source now — two
// physically identical phones will still get different fingerprints because
// each one rolled its own random ID on first launch. localStorage clears if
// the user clears app data / reinstalls, which starts a "new device" for
// gating purposes — same trade-off every app with this pattern accepts.
function getOrCreateInstallId() {
    try {
        const KEY = 'nt_install_id';
        let id = localStorage.getItem(KEY);
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
            localStorage.setItem(KEY, id);
        }
        return id;
    } catch { return ''; } // localStorage unavailable — falls back to the weaker hardware-only signal below
}

async function generateDeviceFingerprint() {
    try {
        const parts = [];
        parts.push(getOrCreateInstallId()); // dominant entropy source, see note above
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200; canvas.height = 50;
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = '#069'; ctx.fillText('NEWTUBE-fp', 2, 15);
        parts.push(canvas.toDataURL());
        parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
        parts.push(navigator.language || '');
        parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        parts.push(navigator.hardwareConcurrency || '');
        const data = new TextEncoder().encode(parts.join('|||'));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch { return null; }
}

// ⚠️ NEW — absolute last-resort safety net. If ANY future script (ad SDK or
// otherwise) ever blocks parsing again, or init() throws something not
// caught above, this guarantees the user is never stuck on the static "92%"
// splash forever — after 20s, if the splash is still there, force the
// connection-error/retry screen.
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('out')) showConnectionErrorScreen();
}, 20000);

init();
</script>
