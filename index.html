<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEWTUBE — Movies, Anime & Videos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- AD NETWORK SDKs (same zone / block IDs as before). `defer` = they never block the app from opening. -->
<script defer src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script defer src='//libtl.com/sdk.js' data-zone='9442539' data-sdk='show_9442539'></script>
<script defer src="https://ad.gigapub.tech/script?id=846"></script>
<style>
:root{--bg:#0a0a0f;--card:#15151d;--card2:#1d1d28;--line:rgba(255,255,255,.08);--ink:#f4f4f7;--mute:#9a9aab;--acc:#ff4d2e;--acc2:#ff8a3d;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Helvetica,Arial,sans-serif;font-size:14px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(var(--bg) 70%,rgba(10,10,15,0))}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.5px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff}
.brand b{color:var(--acc)}
.pbtn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1.5px solid var(--line);overflow:hidden;display:grid;place-items:center}
.pbtn img{width:100%;height:100%;object-fit:cover}
#view{padding:0 14px calc(86px + env(safe-area-inset-bottom));min-height:80vh}
h2{font-size:16px;font-weight:700;margin:20px 0 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(14,14,20,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mute);font-size:11px;font-weight:600}
.nav button.on{color:var(--acc)}
.nav svg{width:22px;height:22px}
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--card);cursor:pointer;margin-top:4px}
.hero img{width:100%;height:100%;object-fit:cover}
.hg{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,.96) 8%,rgba(10,10,15,.1) 60%)}
.hc{position:absolute;left:14px;right:14px;bottom:14px}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--acc2);margin-bottom:5px}
.ht{font-size:18px;font-weight:800;line-height:1.25;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.row::-webkit-scrollbar{display:none}
.row .yt{flex:0 0 232px}.row .po{flex:0 0 112px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 9px}
.yt,.po{cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card)}
.th img,.pth img{width:100%;height:100%;object-fit:cover}
.pl{position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:10px}
.tt,.pt{margin-top:6px;font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pth{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2a1d3a,#1a1a28)}
.badge{position:absolute;left:6px;top:6px;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.65)}
.bar{position:sticky;top:58px;z-index:10;background:var(--bg);padding:2px 0 8px}
.search{width:100%;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -14px 0;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.more{display:block;margin:18px auto 0}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.7}
.msg .btn{margin-top:14px}
/* overlays */
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;padding-bottom:env(safe-area-inset-bottom)}
#ov.on{display:block}
.x{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.dh{position:relative;aspect-ratio:16/11;background:var(--card)}
.dh img{width:100%;height:100%;object-fit:cover}
.dh .x{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top))}
.dbody{padding:0 16px 30px;margin-top:-34px;position:relative}
.dcat{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--acc2)}
.dbody h1{font-size:21px;line-height:1.25;margin:5px 0 16px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.note{margin-top:16px;color:var(--mute);font-size:12px;line-height:1.6}
.ph{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;aspect-ratio:16/9;background:#000}
.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.cd{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px}
.cd.on{display:flex}
.cdn{font-size:44px;font-weight:800;color:var(--acc2)}
.cdt{font-size:13px;color:#ddd}
.pinfo{padding:14px 16px 0}
.pinfo h1{font-size:17px;line-height:1.3}
.pbody{padding:0 14px 30px}
.nx{display:flex;gap:10px;align-items:center;margin-bottom:12px;cursor:pointer}
.nx .th{width:128px;flex:0 0 auto}.nx .pth{width:70px;flex:0 0 auto}
.nx .tt{margin:0;font-size:13px}
/* ads + profile */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card .ic{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.card .mid{flex:1;min-width:0}.card .mid b{display:block;font-size:14px}.card .mid span{font-size:12px;color:var(--mute)}
.lead{color:var(--mute);line-height:1.6;font-size:13px;margin:6px 0 14px}
.pav{width:92px;height:92px;border-radius:50%;margin:10px auto 12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:38px;font-weight:800;overflow:hidden;border:3px solid var(--card2)}
.pav img{width:100%;height:100%;object-fit:cover}
.pname{text-align:center;font-size:19px;font-weight:800}.psub{text-align:center;color:var(--mute);margin-top:3px;font-size:13px}
.stats{display:flex;gap:10px;margin:18px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--acc2)}.stats span{font-size:11.5px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;background:#25252f;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="mark">N</div><span>NEW<b>TUBE</b></span></div>
  <button class="pbtn" id="pbtn" data-act="prof" aria-label="Profile"></button>
</div>
<div id="view"></div>
<div class="nav" id="nav"></div>
<div id="ov"></div>
<div id="toast"></div>

<script>
'use strict';
// ═════════ CONFIG ═════════
const API = 'https://newtube-ton.vercel.app/api';
const BOT = 'NewTube12_bot';
const ADSGRAM_INT = 'int-27565';     // interstitial: before a video + every 6 min of watching
const ADSGRAM_BLOCK = '27566';       // block ad: Download button + Ads section
const ADSGRAM_TASK = 'task-53569';   // sponsored task card in the Ads section
const AD_EVERY_SEC = 360;            // one ad break per 6 minutes of watching (5-second warning first)
const PREROLL_GAP_MS = 60000;        // no second pre-roll within 60s (stops back-to-back ads when browsing)
const PAGE = 12;

const tg = window.Telegram && window.Telegram.WebApp;
[() => tg.ready(), () => tg.expand(), () => tg.setHeaderColor('#0a0a0f'), () => tg.setBackgroundColor('#0a0a0f')].forEach(f => { try { f(); } catch (e) {} });
const U = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const state = { tab: 'yt', yt: [], mv: [], ytShown: PAGE, mvShown: 18, cat: 'All', q: '', ptoken: 0, adBusy: false, lastAdAt: 0, cur: null, sig: {}, adAt: {} };

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
function imgSrc(u) { u = String(u || ''); if (u.startsWith('data?')) return API + '/' + u; return /^https:\/\//i.test(u) ? u : ''; }
const ytThumb = v => imgSrc(v.thumbnail) || `https://img.youtube.com/vi/${esc(v.videoId)}/hqdefault.jpg`;

// ═════════ DATA (cached on the phone, so the app still opens when the server is slow or down) ═════════
async function getData(type, render) {
  const key = 'nt_c_' + type, cached = store.get(key, null);
  if (cached) render(cached);
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(`${API}/data?type=${type}`, { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (!j.ok || !Array.isArray(j[type])) throw new Error('bad');
    store.set(key, j[type]);
    render(j[type]);
  } catch (e) { if (!cached) render(null); }
}
async function postData(body) {
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(`${API}/data`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    clearTimeout(t);
    return await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
}

// ═════════ ADS ═════════
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
// interstitial (no reward, never blocks playback if there is no fill)
async function showInterstitial() {
  try { if (!window.Adsgram) return false; await withTimeout(window.Adsgram.init({ blockId: ADSGRAM_INT }).show(), 120000); return true; } catch (e) { return false; }
}
// block ad → 'ok' | 'noads' (no inventory / SDK blocked) | 'closed' (user closed it early)
async function showBlockAd() {
  if (!window.Adsgram) return 'noads';
  try { const r = await withTimeout(window.Adsgram.init({ blockId: ADSGRAM_BLOCK }).show(), 120000); return r && r.done === false ? 'closed' : 'ok'; }
  catch (e) { return e && e.done === false && e.error === false ? 'closed' : 'noads'; }
}
const showGiga = async () => { if (typeof window.showGiga !== 'function') throw 0; await withTimeout(window.showGiga('main'), 120000); };
const showMonetag = async () => { if (typeof window.show_9442539 !== 'function') throw 0; await withTimeout(window.show_9442539(), 90000); };
const NETS = [
  { id: 'adsgram', name: 'Adsgram', icon: '📺', run: async () => { const r = await showBlockAd(); if (r !== 'ok') throw 0; } },
  { id: 'giga', name: 'GigaPub', icon: '🎯', run: showGiga },
  { id: 'monetag', name: 'Monetag', icon: '⚡', run: showMonetag }
];
async function watchAd(id) {
  const n = NETS.find(x => x.id === id); if (!n || state.adBusy) return;
  const wait = 30000 - (Date.now() - (state.adAt[id] || 0));
  if (wait > 0) return toast(`Please wait ${Math.ceil(wait / 1000)}s before the next ad`);
  state.adBusy = true; toast(`Loading ${n.name} ad…`);
  try { await n.run(); state.adAt[id] = Date.now(); toast('Thanks for supporting NEWTUBE ❤️'); }
  catch (e) { toast(`${n.name} ad isn’t available right now. Try another one.`); }
  finally { setTimeout(() => { state.adBusy = false; }, 1200); }
}

// ═════════ TABS ═════════
const ICONS = {
  yt: '<path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>',
  mv: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 6l-2-3M12 6l-2-3M17 6l-2-3"/>',
  ads: '<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>'
};
const TABS = [['yt', 'YouTube'], ['mv', 'Videos'], ['ads', 'Ads']];
function drawNav() {
  $('#nav').innerHTML = TABS.map(([id, l]) => `<button data-act="tab" data-id="${id}" class="${state.tab === id ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${l}</button>`).join('');
}
function switchTab(id) {
  state.tab = id; drawNav(); window.scrollTo(0, 0); state.sig = {};
  if (id === 'yt') tabYT(); else if (id === 'mv') tabMV(); else tabAds();
}
const skeleton = () => `<div class="sk" style="aspect-ratio:16/10;margin-top:4px"></div><div class="grid2" style="margin-top:22px">${'<div class="sk" style="aspect-ratio:16/9"></div>'.repeat(4)}</div>`;
const errBlock = (act, t) => `<div class="msg">😕<br>${t}<br><button class="btn pri" data-act="${act}">Try again</button></div>`;
const changed = (k, d) => { const s = JSON.stringify(d); if (state.sig[k] === s) return false; state.sig[k] = s; return true; };

// ───── YouTube section (movie-site look: big featured banner, rows, grid) ─────
const ytCard = (v, cls) => `<div class="yt" data-act="play" data-id="${esc(v._id)}"><div class="th"><img loading="lazy" src="${ytThumb(v)}" alt=""><span class="pl">▶</span></div><div class="tt">${esc(v.title)}</div></div>`;
function tabYT() {
  const v = $('#view'); v.innerHTML = skeleton();
  getData('videos', list => {
    if (state.tab !== 'yt') return;
    if (!list) { v.innerHTML = errBlock('retry', 'Couldn’t load videos.'); return; }
    if (!list.length) { v.innerHTML = '<div class="msg">No videos yet.<br>Check back soon!</div>'; return; }
    if (!changed('yt', list)) return;
    state.yt = list;
    const hero = list[Math.floor(Date.now() / 864e5) % list.length];
    v.innerHTML = `
      <div class="hero" data-act="play" data-id="${esc(hero._id)}"><img src="${ytThumb(hero)}" alt=""><div class="hg"></div>
        <div class="hc"><div class="tag">FEATURED</div><div class="ht">${esc(hero.title)}</div><span class="btn pri">▶ Play</span></div></div>
      <h2>Latest</h2><div class="row">${list.slice(0, 10).map(ytCard).join('')}</div>
      <h2>All videos</h2><div class="grid2">${list.slice(0, state.ytShown).map(ytCard).join('')}</div>
      ${state.ytShown < list.length ? '<button class="btn more" data-act="more-yt">Load more</button>' : ''}`;
  });
}

// ───── Videos section (movies · anime · series … with category chips + search) ─────
const poCard = m => `<div class="po" data-act="open" data-id="${esc(m._id)}"><div class="pth"><img loading="lazy" src="${imgSrc(m.thumbnail)}" alt="" onerror="this.remove()"><span class="badge">${esc(m.category || '')}</span></div><div class="pt">${esc(m.title)}</div></div>`;
function tabMV() {
  const v = $('#view');
  v.innerHTML = `<div class="bar"><input class="search" id="q" type="search" placeholder="Search movies, anime…" value="${esc(state.q)}"><div class="chips" id="chips"></div></div><div id="mvbody">${skeleton()}</div>`;
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim(); state.mvShown = 18; paintMV(); });
  getData('movies', list => {
    if (state.tab !== 'mv') return;
    if (list && !changed('mv', list)) return;
    state.mv = list || null; paintMV();
  });
}
function paintMV() {
  const body = $('#mvbody'), chips = $('#chips'); if (!body) return;
  const list = state.mv;
  if (!list) { body.innerHTML = errBlock('retry', 'Couldn’t load the library.'); return; }
  if (!list.length) { chips.innerHTML = ''; body.innerHTML = '<div class="msg">No movies yet.<br>New ones are added regularly!</div>'; return; }
  const cats = ['All', ...new Set(list.map(m => m.category).filter(Boolean))];
  if (!cats.includes(state.cat)) state.cat = 'All';
  chips.innerHTML = cats.map(c => `<button class="chip ${c === state.cat ? 'on' : ''}" data-act="cat" data-id="${esc(c)}">${esc(c)}</button>`).join('');
  const q = state.q.toLowerCase();
  if (state.cat === 'All' && !q) {
    const hero = list[0];
    body.innerHTML = `
      <div class="hero" data-act="open" data-id="${esc(hero._id)}" style="margin-top:12px"><img src="${imgSrc(hero.thumbnail)}" alt="" onerror="this.remove()"><div class="hg"></div>
        <div class="hc"><div class="tag">NEW · ${esc((hero.category || '').toUpperCase())}</div><div class="ht">${esc(hero.title)}</div><span class="btn pri">▶ Watch now</span></div></div>
      ${cats.slice(1).map(c => `<h2>${esc(c)}</h2><div class="row">${list.filter(m => m.category === c).slice(0, 14).map(poCard).join('')}</div>`).join('')}`;
    return;
  }
  const f = list.filter(m => (state.cat === 'All' || m.category === state.cat) && (!q || String(m.title).toLowerCase().includes(q)));
  body.innerHTML = f.length
    ? `<div class="grid3" style="margin-top:12px">${f.slice(0, state.mvShown).map(poCard).join('')}</div>${state.mvShown < f.length ? '<button class="btn more" data-act="more-mv">Load more</button>' : ''}`
    : '<div class="msg">Nothing found.</div>';
}

// ───── Ads section ─────
function tabAds() {
  $('#view').innerHTML = `
    <h2 style="margin-top:12px">Support NEWTUBE</h2>
    <p class="lead">NEWTUBE is free for everyone. Watching an ad here helps us keep adding new movies, anime and videos. Thank you ❤️</p>
    ${NETS.map(n => `<div class="card"><div class="ic">${n.icon}</div><div class="mid"><b>${n.name} ad</b><span>A short ad · tap to watch</span></div><button class="btn pri" data-act="ad" data-id="${n.id}">Watch</button></div>`).join('')}
    <div class="card" id="sp"><div class="ic">🎯</div><div class="mid"><b>Sponsored task</b><span>Try a partner offer</span></div>
      <adsgram-task class="adtask" data-block-id="${ADSGRAM_TASK}" data-debug="false"><span slot="reward"></span><div slot="button" class="btn pri">Open</div><div slot="claim" class="btn pri">Done</div><div slot="done" class="btn">✓</div></adsgram-task></div>`;
  const t = $('adsgram-task'); if (t) t.addEventListener('onBannerNotFound', () => { const c = $('#sp'); if (c) c.remove(); });
}

// ═════════ OVERLAY (movie details · player · profile) ═════════
function ov(html) { const o = $('#ov'); o.innerHTML = html; o.classList.add('on'); o.scrollTop = 0; document.body.classList.add('lock'); try { tg.BackButton.show(); } catch (e) {} }
function closeOv() { stopPlayer(); const o = $('#ov'); o.classList.remove('on'); o.innerHTML = ''; document.body.classList.remove('lock'); try { tg.BackButton.hide(); } catch (e) {} }
try { tg.BackButton.onClick(closeOv); } catch (e) {}

function openMovie(m) {
  state.cur = m;
  ov(`<div class="dh"><img src="${imgSrc(m.thumbnail)}" alt="" onerror="this.remove()"><div class="hg"></div><button class="x" data-act="close">✕</button></div>
    <div class="dbody"><div class="dcat">${esc((m.category || '').toUpperCase())}</div><h1>${esc(m.title)}</h1>
    <div class="acts">${m.streamUrl ? '<button class="btn pri" data-act="watch">▶ Watch</button>' : ''}${m.canDownload ? '<button class="btn" id="dlbtn" data-act="dl">⬇ Download</button>' : ''}</div>
    ${!m.streamUrl && !m.canDownload ? '<p class="note">Not available yet.</p>' : ''}
    ${m.canDownload ? `<p class="note">Download: watch one short ad, then the file is sent to your chat with @${BOT}.</p>` : ''}</div>`);
}

// ═════════ PLAYER (ad before play + one ad every 6 min with a 5-second warning) ═════════
function mediaCmd(c) {
  const f = $('#yt'); if (f && f.contentWindow) try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: c === 'p' ? 'pauseVideo' : 'playVideo', args: [] }), '*'); } catch (e) {}
  const v = $('#vid'); if (v) try { c === 'p' ? v.pause() : v.play(); } catch (e) {}
}
function stopPlayer() {
  state.ptoken++; clearInterval(state.tick); state.adBusy = false;
  const v = $('#vid'); if (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} }
  if (state.hls) { try { state.hls.destroy(); } catch (e) {} state.hls = null; }
}
async function adBreak(label, secs, token) {
  if (state.adBusy) return; state.adBusy = true; mediaCmd('p');
  const cd = $('#cd');
  try {
    if (cd) { cd.classList.add('on'); for (let s = secs; s > 0; s--) { cd.innerHTML = `<div class="cdn">${s}</div><div class="cdt">${label}</div>`; await sleep(1000); if (token !== state.ptoken) return; } cd.innerHTML = '<div class="cdt">Loading ad…</div>'; }
    await showInterstitial(); state.lastAdAt = Date.now();
  } finally { state.adBusy = false; if (cd) { cd.classList.remove('on'); cd.innerHTML = ''; } if (token === state.ptoken) mediaCmd('r'); }
}
function loadHls() {
  return new Promise((res, rej) => { if (window.Hls) return res(); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function openPlayer(item, kind) {
  stopPlayer(); const token = state.ptoken, isYT = kind === 'yt';
  const pool = isYT ? state.yt : state.mv, others = (pool || []).filter(x => x._id !== item._id && (isYT || !item.category || x.category === item.category) && (isYT || x.streamUrl)).slice(0, 12);
  addHist(kind, item);
  ov(`<div class="ph"><button class="x" data-act="close">←</button><div class="pn">${esc(item.title)}</div></div>
    <div class="stage" id="stage"><div class="cd" id="cd"></div></div>
    <div class="pinfo"><h1>${esc(item.title)}</h1>${!isYT && item.canDownload ? '<div class="acts" style="margin-top:12px"><button class="btn" id="dlbtn" data-act="dl">⬇ Download</button></div>' : ''}</div>
    <div class="pbody">${others.length ? '<h2>Up next</h2>' + others.map(o => isYT
      ? `<div class="nx" data-act="play" data-id="${esc(o._id)}"><div class="th"><img loading="lazy" src="${ytThumb(o)}" alt=""></div><div class="tt">${esc(o.title)}</div></div>`
      : `<div class="nx" data-act="watch2" data-id="${esc(o._id)}"><div class="pth"><img loading="lazy" src="${imgSrc(o.thumbnail)}" alt="" onerror="this.remove()"></div><div class="tt">${esc(o.title)}</div></div>`).join('') : ''}</div>`);
  state.cur = item;
  // ad BEFORE the video (3-second heads-up so nobody taps the ad by accident)
  if (Date.now() - state.lastAdAt > PREROLL_GAP_MS) await adBreak('Your video starts after a short ad', 3, token);
  if (token !== state.ptoken) return;
  const stage = $('#stage'); if (!stage) return;
  if (isYT) {
    stage.insertAdjacentHTML('afterbegin', `<iframe id="yt" src="https://www.youtube.com/embed/${encodeURIComponent(item.videoId)}?autoplay=1&playsinline=1&rel=0&enablejsapi=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`);
  } else {
    stage.insertAdjacentHTML('afterbegin', `<video id="vid" controls playsinline autoplay></video>`);
    const vid = $('#vid'), url = item.streamUrl;
    if (/\.m3u8(\?|$)/i.test(url) && !vid.canPlayType('application/vnd.apple.mpegurl')) {
      try { await loadHls(); if (window.Hls && Hls.isSupported() && token === state.ptoken) { state.hls = new Hls(); state.hls.loadSource(url); state.hls.attachMedia(vid); } } catch (e) { toast('Couldn’t load this video'); }
    } else vid.src = url;
    vid.addEventListener('error', () => toast('This video couldn’t be loaded'));
  }
  // one ad break per 6 minutes of real watching
  let watched = 0;
  state.tick = setInterval(() => {
    if (token !== state.ptoken) return clearInterval(state.tick);
    const v = $('#vid');
    if (document.hidden || state.adBusy || (v && v.paused)) return;
    if (++watched >= AD_EVERY_SEC) { watched = 0; adBreak('Ad coming up…', 5, token); }
  }, 1000);
}

// ═════════ DOWNLOAD (block ad → bot sends the file to the user's chat) ═════════
async function download() {
  const m = state.cur; if (!m || !m.canDownload) return;
  if (!tg || !tg.initData) return toast('Open NEWTUBE inside Telegram to download');
  const btn = $('#dlbtn'); if (btn) btn.disabled = true;
  try {
    const ad = await showBlockAd();
    if (ad === 'closed') return toast('Please watch the whole ad to download');
    toast('Sending the file…');
    const r = await postData({ action: 'download', initData: tg.initData, id: m._id });
    if (r.ok) {
      store.set('nt_dl', (store.get('nt_dl', 0) || 0) + 1);
      toast(`✅ Sent! Check your chat with @${BOT}`);
      setTimeout(() => { try { tg.openTelegramLink('https://t.me/' + BOT); } catch (e) {} }, 1400);
    } else if (r.error === 'send_failed') {
      toast(`Press Start in @${BOT} first, then try again`);
      setTimeout(() => { try { tg.openTelegramLink('https://t.me/' + BOT); } catch (e) {} }, 1600);
    } else if (r.error === 'too_fast') toast('Please wait a few seconds');
    else toast('Couldn’t send the file. Please try again.');
  } finally { setTimeout(() => { const b = $('#dlbtn'); if (b) b.disabled = false; }, 4000); }
}

// ═════════ PROFILE (icon at the top) ═════════
const getHist = () => store.get('nt_hist', []);
function addHist(kind, item) {
  const h = getHist().filter(x => !(x.kind === kind && x.item._id === item._id));
  h.unshift({ kind, item: { _id: item._id, title: item.title, thumbnail: item.thumbnail, videoId: item.videoId, streamUrl: item.streamUrl, category: item.category, canDownload: item.canDownload } });
  store.set('nt_hist', h.slice(0, 20)); store.set('nt_watched', (store.get('nt_watched', 0) || 0) + 1);
}
function avatar(big) {
  const name = U.first_name || 'U', photo = /^https:\/\//.test(U.photo_url || '') ? U.photo_url : '';
  return photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : (U.first_name ? esc(name.charAt(0).toUpperCase()) : '👤');
}
function openProfile() {
  const h = getHist(), name = [U.first_name, U.last_name].filter(Boolean).join(' ') || 'Guest';
  ov(`<div class="ph"><button class="x" data-act="close">←</button><div class="pn">Profile</div></div>
    <div class="pbody"><div class="pav">${avatar(true)}</div><div class="pname">${esc(name)}</div>
    <div class="psub">${U.username ? '@' + esc(U.username) : ''}${U.username && U.id ? ' · ' : ''}${U.id ? 'ID ' + esc(U.id) : ''}</div>
    <div class="stats"><div><b>${store.get('nt_watched', 0) || 0}</b><span>Videos watched</span></div><div><b>${store.get('nt_dl', 0) || 0}</b><span>Downloads</span></div></div>
    ${h.length ? `<h2 style="margin-top:6px">Recently watched</h2>${h.slice(0, 10).map((x, i) => `<div class="nx" data-act="hist" data-id="${i}"><div class="th"><img loading="lazy" src="${x.kind === 'yt' ? ytThumb(x.item) : imgSrc(x.item.thumbnail)}" alt="" onerror="this.remove()"></div><div class="tt">${esc(x.item.title)}</div></div>`).join('')}<button class="btn" data-act="clear" style="margin-top:6px">Clear history</button>` : '<p class="lead" style="text-align:center">Your watch history will show up here.</p>'}</div>`);
}

// ═════════ EVENTS ═════════
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  const find = (list, i) => (list || []).find(x => x._id === i);
  if (act === 'tab') switchTab(id);
  else if (act === 'prof') openProfile();
  else if (act === 'close') closeOv();
  else if (act === 'retry') switchTab(state.tab);
  else if (act === 'play') { const v = find(state.yt, id); if (v) openPlayer(v, 'yt'); }
  else if (act === 'open') { const m = find(state.mv, id); if (m) openMovie(m); }
  else if (act === 'watch') { if (state.cur) openPlayer(state.cur, 'mv'); }
  else if (act === 'watch2') { const m = find(state.mv, id); if (m) openPlayer(m, 'mv'); }
  else if (act === 'dl') download();
  else if (act === 'more-yt') { state.ytShown += PAGE; state.sig = {}; tabYT(); }
  else if (act === 'more-mv') { state.mvShown += 18; paintMV(); }
  else if (act === 'cat') { state.cat = id; state.mvShown = 18; paintMV(); }
  else if (act === 'ad') watchAd(id);
  else if (act === 'hist') { const x = getHist()[+id]; if (x) { if (x.kind === 'mv') { state.mv = state.mv && state.mv.length ? state.mv : [x.item]; } else { state.yt = state.yt && state.yt.length ? state.yt : [x.item]; } openPlayer(x.item, x.kind); } }
  else if (act === 'clear') { store.set('nt_hist', []); openProfile(); }
});

// ═════════ START — shows instantly, no login / server call needed ═════════
(function start() {
  $('#pbtn').innerHTML = avatar(false);
  drawNav(); switchTab('yt');
  // warm the Videos library in the background so that tab opens fast
  getData('movies', list => { if (list && !state.mv.length) state.mv = list; });
})();
</script>
</body>
